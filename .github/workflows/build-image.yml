name: Build y publicar imagen

# ─────────────────────────────────────────────────────────────────────────────
# ESTÁNDAR DE DESPLIEGUE — el mismo en las 6 apps.
#
#   1. Build + push a ghcr.io, AQUÍ en ubuntu-latest. El servidor NO compila:
#      tiene 1 vCPU / 1.9 GB y compilar ahí compite por RAM con producción.
#   2. Este workflow NO toca el servidor. No hace `docker pull`, ni `docker rm`,
#      ni `run_app.sh`. Arcane (docker.ecc-sa.com.mx) es el dueño del contenedor
#      y lo reconoce por la etiqueta com.docker.compose.project.
#   3. El operador aplica la imagen: Arcane → Projects → admon → Updates → Update.
#
# POR QUÉ NO SE BAJA LA IMAGEN ACÁ (esto se aprendió a golpes el 2026-10-23):
# Arcane resuelve "la imagen que debería estar corriendo" por el tag local
# `:latest`. Un `docker pull` en el servidor mueve ese tag y Arcane contesta
# `up_to_date` aunque producción siga con la imagen vieja. El único que mueve
# `:latest` es Arcane, al aplicar el Update.
#
# Antes este archivo tenía `desbloquear`, `gate` y `deploy` (runner self-hosted,
# hotsync/rebuild). Ya no hacen falta: no hay nada que correr en el servidor.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-admon
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Fijo, no ${{ github.repository }}: el nombre del paquete tiene que ser
  # EXACTAMENTE el que usa el compose de Arcane, o Arcane mira una imagen que
  # este workflow nunca publica.
  IMAGE_NAME: hector1516/admon

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Admon · imagen publicada"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- imagen: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` → :latest + :sha"
            echo "- runner: \`${{ runner.name }}\` (nube — el servidor no compiló nada)"
            echo ""
            echo "Arcane la detecta en su próximo chequeo (cada hora en punto). Para aplicarla:"
            echo "**Arcane → Projects → admon → Updates → Update**"
          } >> "$GITHUB_STEP_SUMMARY"
