	<body>
		<div id="app"></div>
		<script>
			// Force cache bust: si la versión guardada no coincide, recargar sin caché
			try {
				var cur = '1.0.2';
				var stored = localStorage.getItem('admon_app_version');
				if (stored && stored !== cur) {
					localStorage.setItem('admon_app_version', cur);
					location.replace(location.pathname + '?_t=' + Date.now());
				}
				localStorage.setItem('admon_app_version', cur);
			} catch(e) {}
			// Registrar service worker al arrancar
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register('/sw.js').catch(() => {});
				navigator.serviceWorker.addEventListener('message', (e) => {
					if (e.data && e.data.type === 'FORCE_RELOAD') location.reload();
				});
			}
		</script>
